name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code. Nothing here can push,
# comment, or read secrets (none are configured for this workflow).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway Postgres for this job. The database guarantees (least
    # privilege, append-only audit log, CHECK constraints) can only be proven
    # against a real server, never a mock. Neon is for real environments and
    # is never touched by CI (ADR 0008). Same major version as Neon.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contact_sphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway values for this job only. Real configuration lives in the
      # Render and Vercel dashboards, never in the repository.
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'
      # Migrations run as the owner; the API and its tests connect as the
      # least-privilege app role, exactly as in production.
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/contact_sphere_test
      APP_DB_PASSWORD: ci-only-app-password-not-used-anywhere
      DATABASE_URL: postgresql://contact_sphere_app:ci-only-app-password-not-used-anywhere@localhost:5432/contact_sphere_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Create the app login role (as production does)
        run: npm run db:app-role

      - name: Database guarantee tests (as the app role)
        run: npm run test:db

      - name: API end-to-end tests (as the app role)
        run: npm run test:e2e

      - name: Schema and migrations agree (no drift)
        run: npm run db:drift

      - name: Build
        run: npm run build

  # Vercel installs from apps/web (the project's root directory) with
  # `npm install`, not from the repository root with `npm ci`. On 2026-09-25
  # a root postinstall step broke every Vercel deployment for five PRs while
  # this workflow stayed green, because the two installs behave differently.
  # This job reproduces Vercel's steps exactly, so that cannot happen again.
  vercel-parity:
    name: Web builds the way Vercel builds it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm install from apps/web (as Vercel does)
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: next build (as Vercel does)
        working-directory: apps/web
        run: npm run build

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Production dependencies only, and only high/critical: dev-tool
      # advisories are tracked by Dependabot rather than blocking every PR.
      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
