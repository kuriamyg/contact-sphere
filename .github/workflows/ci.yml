name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code. Nothing here can push,
# comment, or read secrets (none are configured for this workflow).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Throwaway values for this job only. Real configuration lives in the
      # Render and Vercel dashboards, never in the repository.
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: API end-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Production dependencies only, and only high/critical: dev-tool
      # advisories are tracked by Dependabot rather than blocking every PR.
      - name: npm audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
