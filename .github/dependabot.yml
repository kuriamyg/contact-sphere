version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem instead of dozens — easier to review and test.
      nestjs:
        patterns: ['@nestjs/*']
      next-react:
        patterns:
          ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
