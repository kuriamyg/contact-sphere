version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major versions change APIs and are adopted deliberately, one per PR,
    # with an ADR (docs/decisions/0002). Dependabot proposes minor and patch
    # updates only; security updates are still raised for any version.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # One PR per ecosystem instead of dozens — easier to review and test.
      nestjs:
        patterns: ['@nestjs/*']
      next-react:
        patterns:
          ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
